site_name: Haddacerra Gateway Docs
site_url: https://docs.haddacerra.com
repo_url: https://github.com/haddacerra/docs
site_description: Official technical documentation and hardware setup guides for the Haddacerra Gateway system.

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: cyan
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables

nav:
  - Gateway Overview: index.md
  - Operations Guide:
      - How To Start: operations/how-to.md
      - Network & WebRTC: operations/network.md
      - Video Pipeline: operations/video.md
  - Hardware:
      - Specifications: hardware/specs.md
      - 3D Enclosure Files: hardware/enclosure.md
