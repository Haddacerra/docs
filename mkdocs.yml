site_name: Haddacerra Gateway Docs
site_url: https://docs.haddacerra.com
repo_url: https://github.com/haddacerra/docs
site_description: Official technical documentation and hardware setup guides for the Haddacerra Gateway system.

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: cyan
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables

nav:
  - Welcome: index.md
  - Getting Started:
      - Enclosure Assembly: getting-started/enclosure.md
      - Hardware Setup: getting-started/installation.md
