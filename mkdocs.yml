site_name: Haddacerra Gateway Docs
site_url: https://docs.haddacerra.com
repo_url: https://github.com/haddacerra/docs
site_description: Official technical documentation and hardware setup guides for the Haddacerra Gateway system.

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    scheme: slate
    primary: black
    accent: cyan
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      toc_depth: 0 # Disables generating sub-headings in the TOC tree

nav:
  - Gateway Overview: index.md
  - Operations Guide:
      - How To Start: operations/how-to.md
      - Control Panel UI: operations/cpui.md
      - Video Streaming: operations/video.md
      - OLED Status Display: operations/oled.md
  - Hardware:
      - Specifications: hardware/specs.md
      - Enclosure: hardware/enclosure.md

